name: SimfitMemo
options:
  minimumXcodeGenVersion: 2.45.0
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: 5.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
targets:
  SimfitMemo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SimfitMemo
      - path: Shared
    dependencies:
      - target: SimfitMemo Watch App
        embed: true
      - target: SimfitMemo Live Activity
        embed: true
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: ActivityKit.framework
    info:
      path: SimfitMemo/Info.plist
      properties:
        CFBundleDisplayName: SimfitMemo
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: SimfitMemo will use HealthKit heart-rate data when workout watch features are enabled.
    entitlements:
      path: SimfitMemo/SimfitMemo.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simfitmemo.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SimfitMemo Live Activity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SimfitMemoLiveActivity
      - path: Shared
    dependencies:
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
    info:
      path: SimfitMemoLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: SimfitMemo
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simfitmemo.app.liveactivity
        APPLICATION_EXTENSION_API_ONLY: YES
  SimfitMemo Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: SimfitMemoWatch Watch App
      - path: Shared
    dependencies:
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
    info:
      path: SimfitMemoWatch Watch App/Info.plist
      properties:
        CFBundleDisplayName: SimfitMemo
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.simfitmemo.app
        NSHealthShareUsageDescription: SimfitMemo Watch will use HealthKit heart-rate data during rest timers when permission is granted.
    entitlements:
      path: SimfitMemoWatch Watch App/SimfitMemoWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simfitmemo.app.watchapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_COMPLICATION_NAME: ""
  SimfitMemoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SimfitMemoTests
      - path: Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.simfitmemo.app.tests
        TEST_HOST: ""
        BUNDLE_LOADER: ""
  SimfitMemoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SimfitMemoUITests
    dependencies:
      - target: SimfitMemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.simfitmemo.app.uitests
        TEST_TARGET_NAME: SimfitMemo
schemes:
  SimfitMemo:
    build:
      targets:
        SimfitMemo: [run, archive, profile, analyze]
        SimfitMemo Live Activity: [run, archive, profile, analyze]
        SimfitMemoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SimfitMemoTests
  SimfitMemo Watch App:
    build:
      targets:
        SimfitMemo Watch App: all
    run:
      config: Debug
  SimfitMemoUnitTests:
    build:
      targets:
        SimfitMemoTests: [test]
    test:
      config: Debug
      targets:
        - SimfitMemoTests
